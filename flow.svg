<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 96" width="1600" height="96" role="img" aria-label="Animated counter-current heat exchanger">
<defs>
<linearGradient id="hot" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="0"><stop offset="0" stop-color="#F07A2E"/><stop offset="1" stop-color="#8A97A5"/></linearGradient>
<linearGradient id="cold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="0"><stop offset="0" stop-color="#8A97A5"/><stop offset="1" stop-color="#1FB5DC"/></linearGradient>
<linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".06" stop-color="#fff"/><stop offset=".94" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="96"><rect width="1600" height="96" fill="url(#fade)"/></mask>
<style>
.h{fill:none;stroke:url(#hot);stroke-width:2.2;stroke-linecap:round;animation:r linear infinite}
.c{fill:none;stroke:url(#cold);stroke-width:2.2;stroke-linecap:round;animation:l linear infinite}
.w{stroke:#8A97A5;stroke-width:1.5;opacity:.55}
.b{stroke:#8A97A5;stroke-width:1;opacity:.3}
.q{fill:#D9A070;opacity:0;animation:q 2.4s ease-in infinite}
@keyframes r{to{stroke-dashoffset:-120}}
@keyframes l{to{stroke-dashoffset:120}}
@keyframes q{0%{transform:translateY(0);opacity:0}25%{opacity:.85}100%{transform:translateY(14px);opacity:0}}
@media (prefers-reduced-motion:reduce){.h,.c,.q{animation:none}.q{opacity:.5}}
</style>
</defs>
